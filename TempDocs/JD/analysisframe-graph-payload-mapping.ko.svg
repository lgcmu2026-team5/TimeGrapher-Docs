<text x="946" y="516" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">VarioRenderer, LongTermPerfRenderer</text>
<text x="946" y="534" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">MetricsHistory.Rate/Amplitude/Stats/Positions</text>
  <rect x="930" y="585" width="460" height="100" rx="0" ry="0" fill="#FFFFFF" stroke="#4F5B62" stroke-width="2"/>
<text x="946" y="613" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">Beat Noise / Avg Envelope</text>
<text x="946" y="641" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">BeatNoiseScopeRenderer, WaveformCompareRenderer</text>
<text x="946" y="659" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">BeatSegments + A/C markers + average lanes</text>
  <rect x="930" y="710" width="460" height="100" rx="0" ry="0" fill="#FFFFFF" stroke="#4F5B62" stroke-width="2"/>
<text x="946" y="738" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">Sound Print / Spectrogram</text>
<text x="946" y="766" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">SoundPrintFrameConsumer, SpectrogramFrameConsumer</text>
<text x="946" y="784" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">SoundImage, SpectrogramImage, live-column metadata</text>

