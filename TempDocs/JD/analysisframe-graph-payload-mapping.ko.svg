  <text x="742" y="928" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">색상 = payload group / 화살표 = 대표 소비 관계 / 오른쪽 박스 = 대표 display 또는 renderer</text>
