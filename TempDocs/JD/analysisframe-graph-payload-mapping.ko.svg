<text x="461" y="663" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">Beat Payload</text>
<text x="461" y="691" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">BeatSegments</text>
<text x="461" y="709" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">recent beat windows, A/C markers, average lanes</text>
  <rect x="445" y="750" width="360" height="105" rx="0" ry="0" fill="#F2ECFF" stroke="#6B46C1" stroke-width="2"/>
<text x="461" y="778" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">Image / Annotation Payload</text>
<text x="461" y="806" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">SoundImage, SpectrogramImage + metadata</text>
<text x="461" y="824" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">SignalQuality advisory annotation</text>

  <rect x="930" y="210" width="460" height="100" rx="0" ry="0" fill="#FFFFFF" stroke="#4F5B62" stroke-width="2"/>
<text x="946" y="238" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">Scope / Rate Scope</text>
<text x="946" y="266" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">RateScopeRenderer</text>
<text x="946" y="284" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">ScopeSeries + RateSeries + markers + MetricsUpdate</text>
  <rect x="930" y="335" width="460" height="100" rx="0" ry="0" fill="#FFFFFF" stroke="#4F5B62" stroke-width="2"/>
<text x="946" y="363" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">Beat Error</text>
<text x="946" y="391" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">BeatErrorDiagRenderer</text>
<text x="946" y="409" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">RateSeries + MetricsHistory.BeatError + interval summary</text>
  <rect x="930" y="460" width="460" height="100" rx="0" ry="0" fill="#FFFFFF" stroke="#4F5B62" stroke-width="2"/>
