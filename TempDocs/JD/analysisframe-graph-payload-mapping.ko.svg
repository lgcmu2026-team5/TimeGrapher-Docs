<text x="461" y="538" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">Metrics Payload</text>
<text x="461" y="566" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">MetricsUpdate / MetricsHistory</text>
<text x="461" y="584" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">Rate, Amplitude, BeatError, Stats</text>
