  <rect x="55" y="875" width="605" height="72" rx="0" ry="0" fill="#FAFAFA" stroke="#DDD" stroke-width="1"/>
  <text x="75" y="902" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">발표용 메시지</text>
  <text x="75" y="928" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">각 graph가 Core에 직접 붙는 것이 아니라, 같은 AnalysisFrame contract에서 필요한 payload만 소비한다.</text>

  <rect x="720" y="875" width="670" height="72" rx="0" ry="0" fill="#FFFFFF" stroke="#111" stroke-width="2"/>
