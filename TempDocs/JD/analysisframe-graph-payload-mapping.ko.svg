  <rect width="1560" height="980" fill="#fff"/>
  <text x="40" y="58" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="30" font-weight="700" fill="#111" text-anchor="start">AnalysisFrame Graph-to-Payload Mapping View</text>
  <text x="42" y="94" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="400" fill="#555" text-anchor="start">UML 클래스 다이어그램의 정적 구조를 실제 대표 graph/display 소비 관계로 연결한다. 전체 그래프 목록이 아니라 발표용 대표 흐름이다.</text>
  <rect x="40" y="112" width="250" height="54" rx="0" ry="0" fill="#F7F7F7" stroke="#AAA" stroke-width="1"/>
<text x="165" y="134" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="middle">1. UML Class Diagram</text>
<text x="165" y="153" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="middle">구조: field/type 관계</text>
<rect x="370" y="112" width="250" height="54" rx="0" ry="0" fill="#FFF1EA" stroke="#FF6B35" stroke-width="3"/>
<text x="495" y="134" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="middle">2. Mapping View</text>
<text x="495" y="153" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="middle">payload -&gt; 대표 graph</text>
<rect x="700" y="112" width="250" height="54" rx="0" ry="0" fill="#F7F7F7" stroke="#AAA" stroke-width="1"/>
<text x="825" y="134" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="middle">3. Sequence Diagram</text>
<text x="825" y="153" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="middle">runtime 전달 흐름</text>
<line x1="290" y1="139" x2="370" y2="139" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="620" y1="139" x2="700" y2="139" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="225" width="300" height="180" rx="0" ry="0" fill="#FFF1EA" stroke="#FF6B35" stroke-width="3"/>
<text x="71" y="253" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">UML Class Diagram에서 온 근거</text>
<text x="71" y="281" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">AnalysisFrame</text>
<text x="71" y="299" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">- ScopeSeries / RateSeries</text>
<text x="71" y="317" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">- Markers</text>
<text x="71" y="335" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">- MetricsUpdate / MetricsHistory</text>
<text x="71" y="353" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">- BeatSegments</text>
<text x="71" y="371" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">- SoundImage / SpectrogramImage</text>
<text x="71" y="389" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">- SignalQuality</text>

  <rect x="445" y="205" width="360" height="130" rx="0" ry="0" fill="#FFF1EA" stroke="#FF6B35" stroke-width="3"/>
<text x="461" y="233" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">AnalysisFrame</text>
<text x="461" y="261" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">한 번의 analysis pass 결과를 묶은</text>
<text x="461" y="279" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">Core.Shared DTO</text>
<text x="461" y="297" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start"></text>
<text x="461" y="315" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">same frame = same UI update contract</text>

  <rect x="445" y="385" width="360" height="105" rx="0" ry="0" fill="#E8F2FF" stroke="#1565C0" stroke-width="2"/>
<text x="461" y="413" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="start">Graph Payload</text>
<text x="461" y="441" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">ScopeSeries / RateSeries</text>
<text x="461" y="459" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="12" font-weight="400" fill="#333" text-anchor="start">Vertical·Horizontal·Text Markers</text>
