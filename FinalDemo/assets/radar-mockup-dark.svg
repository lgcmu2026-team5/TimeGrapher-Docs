<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="748" viewBox="0 0 1280 748" font-family="Segoe UI, Inter, Arial, sans-serif">
  <!-- ============ window background (dark theme) ============ -->
  <rect x="0" y="0" width="1280" height="748" fill="#1D1D1B"/>

  <!-- ============ title bar ============ -->
  <rect x="0" y="0" width="1280" height="32" fill="#232321"/>
  <circle cx="20" cy="16" r="6" fill="#C24A62"/>
  <text x="36" y="21" fill="#C2C8CE" font-size="14" font-weight="600">TimeGrapher</text>
  <text x="156" y="21" fill="#6E6E6E" font-size="13">— Positions · Watch Health</text>
  <circle cx="1226" cy="16" r="6" fill="#3A3A38"/>
  <circle cx="1248" cy="16" r="6" fill="#3A3A38"/>
  <circle cx="1262" cy="16" r="0" fill="none"/>
  <rect x="1218" y="9" width="0" height="0"/>
  <text x="1238" y="20" fill="#6E6E6E" font-size="13">▢  ✕</text>

  <!-- ============ toolbar ============ -->
  <rect x="0" y="32" width="1280" height="46" fill="#1D1D1B"/>
  <line x1="0" y1="78" x2="1280" y2="78" stroke="#333333" stroke-width="1"/>
  <!-- input mode -->
  <rect x="16" y="44" width="92" height="24" fill="#2A2A28" stroke="#3A3A38"/>
  <text x="26" y="60" fill="#C2C8CE" font-size="12">Live ▾</text>
  <!-- transport -->
  <rect x="120" y="44" width="74" height="24" fill="#C24A62"/>
  <text x="134" y="60" fill="#FFFFFF" font-size="12" font-weight="600">▶ Start</text>
  <rect x="200" y="44" width="58" height="24" fill="#2A2A28" stroke="#3A3A38"/>
  <text x="212" y="60" fill="#C2C8CE" font-size="12">⏸ Pause</text>
  <rect x="264" y="44" width="62" height="24" fill="#2A2A28" stroke="#3A3A38"/>
  <text x="276" y="60" fill="#C2C8CE" font-size="12">⟲ Reset</text>
  <!-- params right -->
  <rect x="980" y="44" width="86" height="24" fill="#2A2A28" stroke="#3A3A38"/>
  <text x="990" y="60" fill="#C2C8CE" font-size="12">48 kHz ▾</text>
  <rect x="1074" y="44" width="92" height="24" fill="#2A2A28" stroke="#3A3A38"/>
  <text x="1084" y="60" fill="#C2C8CE" font-size="12">Lift 52° ▾</text>
  <rect x="1174" y="44" width="90" height="24" fill="#2A2A28" stroke="#3A3A38"/>
  <text x="1184" y="60" fill="#9A9DA1" font-size="12">⚙ Settings</text>

  <!-- ============ tab strip (two rows, 7 + 6; Positions leads row 2) ============ -->
  <!-- row 1 -->
  <g font-size="12" fill="#9A9DA1">
    <text x="20"  y="100">Rate/Scope</text>
    <text x="110" y="100">Trace</text>
    <text x="166" y="100">Beat Error</text>
    <text x="248" y="100">Vario</text>
    <text x="300" y="100">Long-Term</text>
    <text x="384" y="100">Sweep</text>
    <text x="444" y="100">Escapement</text>
  </g>
  <line x1="0" y1="110" x2="1280" y2="110" stroke="#2A2A28" stroke-width="1"/>
  <!-- row 2 -->
  <g font-size="12" fill="#9A9DA1">
    <text x="110" y="134">Beat Noise</text>
    <text x="196" y="134">Waveforms</text>
    <text x="284" y="134">Filter Scope</text>
    <text x="376" y="134">Sound Print</text>
    <text x="466" y="134">Spectrogram</text>
  </g>
  <!-- active tab: Positions -->
  <text x="20" y="134" fill="#FFFFFF" font-size="12" font-weight="700">Positions</text>
  <rect x="16" y="142" width="78" height="3" fill="#C24A62"/>
  <line x1="0" y1="146" x2="1280" y2="146" stroke="#333333" stroke-width="1"/>

  <!-- ============ LEFT PANEL: position selector + 3D watch ============ -->
  <rect x="12" y="158" width="262" height="556" fill="#202020" stroke="#2E2E2C"/>
  <text x="28" y="184" fill="#9A9DA1" font-size="11" letter-spacing="1">TEST POSITION</text>

  <!-- buttons grid 2x3 -->
  <!-- CH active -->
  <rect x="28"  y="196" width="108" height="44" fill="#C24A62"/>
  <text x="40" y="216" fill="#FFFFFF" font-size="14" font-weight="700">CH</text>
  <text x="40" y="232" fill="#FBD7DE" font-size="10">Dial Up · 298°</text>
  <!-- CB -->
  <rect x="148" y="196" width="108" height="44" fill="#2A2A28" stroke="#3A3A38"/>
  <text x="160" y="216" fill="#C2C8CE" font-size="14" font-weight="700">CB</text>
  <text x="160" y="232" fill="#7E7E7E" font-size="10">Dial Down · 292°</text>
  <!-- 12H -->
  <rect x="28"  y="250" width="108" height="44" fill="#2A2A28" stroke="#3A3A38"/>
  <text x="40" y="270" fill="#C2C8CE" font-size="14" font-weight="700">12H</text>
  <text x="40" y="286" fill="#7E7E7E" font-size="10">Crown Down · 268°</text>
  <!-- 3H -->
  <rect x="148" y="250" width="108" height="44" fill="#2A2A28" stroke="#3A3A38"/>
  <text x="160" y="270" fill="#C2C8CE" font-size="14" font-weight="700">3H</text>
  <text x="160" y="286" fill="#7E7E7E" font-size="10">Crown Left · 255°</text>
  <!-- 6H -->
  <rect x="28"  y="304" width="108" height="44" fill="#2A2A28" stroke="#3A3A38"/>
  <text x="40" y="324" fill="#C2C8CE" font-size="14" font-weight="700">6H</text>
  <text x="40" y="340" fill="#7E7E7E" font-size="10">Crown Up · 250°</text>
  <!-- 9H -->
  <rect x="148" y="304" width="108" height="44" fill="#2A2A28" stroke="#3A3A38"/>
  <text x="160" y="324" fill="#C2C8CE" font-size="14" font-weight="700">9H</text>
  <text x="160" y="340" fill="#7E7E7E" font-size="10">Crown Right · 262°</text>

  <text x="28" y="372" fill="#6E6E6E" font-size="10">Rotate watch by hand, then tap the position.</text>

  <!-- 3D watch model placeholder (CPU-rendered, current = CH) -->
  <text x="28" y="404" fill="#9A9DA1" font-size="11" letter-spacing="1">3D MODEL · CH</text>
  <g transform="translate(143,500)">
    <ellipse cx="0" cy="0" rx="78" ry="74" fill="#15110F"/>
    <ellipse cx="0" cy="0" rx="78" ry="74" fill="none" stroke="#4A4A48" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="62" ry="58" fill="none" stroke="#2E2E2C" stroke-width="1"/>
    <!-- crown at 3 o'clock -->
    <rect x="76" y="-8" width="12" height="16" fill="#4A4A48"/>
    <!-- hands -->
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#C24A62" stroke-width="3"/>
    <line x1="0" y1="0" x2="34" y2="10" stroke="#C2C8CE" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#C24A62"/>
    <!-- ticks -->
    <g stroke="#6E6E6E" stroke-width="2">
      <line x1="0" y1="-58" x2="0" y2="-50"/>
      <line x1="0" y1="58"  x2="0" y2="50"/>
      <line x1="-58" y1="0" x2="-50" y2="0"/>
      <line x1="58" y1="0"  x2="50" y2="0"/>
    </g>
  </g>
  <text x="143" y="600" fill="#7E7E7E" font-size="10" text-anchor="middle">no GPU · CPU raster · runs on Pi</text>

  <!-- ============ CENTER PANEL: RADAR ============ -->
  <rect x="286" y="158" width="672" height="556" fill="#0A0A0A" stroke="#2E2E2C"/>
  <text x="306" y="186" fill="#C2C8CE" font-size="15" font-weight="600">Watch Health Radar — Amplitude by Position</text>
  <!-- metric toggle -->
  <rect x="700" y="170" width="76" height="22" fill="#C24A62"/>
  <text x="712" y="185" fill="#FFFFFF" font-size="11">Amplitude</text>
  <rect x="778" y="170" width="56" height="22" fill="#1A1A18" stroke="#3A3A38"/>
  <text x="790" y="185" fill="#9A9DA1" font-size="11">Rate</text>
  <rect x="836" y="170" width="98" height="22" fill="#1A1A18" stroke="#3A3A38"/>
  <text x="848" y="185" fill="#9A9DA1" font-size="11">Beat error</text>

  <g transform="translate(618,438)">
    <!-- grid rings (hexagonal) -->
    <g fill="none" stroke="#262624" stroke-width="1">
      <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"/>
      <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50"/>
      <polygon points="0,-150 129.9,-75 129.9,75 0,150 -129.9,75 -129.9,-75"/>
    </g>
    <polygon points="0,-200 173.2,-100 173.2,100 0,200 -173.2,100 -173.2,-100" fill="none" stroke="#3A3A38" stroke-width="1.5"/>
    <!-- axes -->
    <g stroke="#2E2E2C" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="-200"/>
      <line x1="0" y1="0" x2="173.2" y2="-100"/>
      <line x1="0" y1="0" x2="173.2" y2="100"/>
      <line x1="0" y1="0" x2="0" y2="200"/>
      <line x1="0" y1="0" x2="-173.2" y2="100"/>
      <line x1="0" y1="0" x2="-173.2" y2="-100"/>
    </g>

    <!-- accept band (healthy zone 250°–310°), amber ring, evenodd cut-out -->
    <path fill="#E9C46A" fill-opacity="0.13" fill-rule="evenodd" stroke="none"
      d="M0,-183.33 158.8,-91.67 158.8,91.67 0,183.33 -158.8,91.67 -158.8,-91.67 Z
         M0,-83.33 72.16,-41.67 72.16,41.67 0,83.33 -72.16,41.67 -72.16,-41.67 Z"/>
    <polygon points="0,-183.33 158.8,-91.67 158.8,91.67 0,183.33 -158.8,91.67 -158.8,-91.67" fill="none" stroke="#9A6A00" stroke-width="1" stroke-dasharray="2 3"/>
    <polygon points="0,-83.33 72.16,-41.67 72.16,41.67 0,83.33 -72.16,41.67 -72.16,-41.67" fill="none" stroke="#9A6A00" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- reference polygon (target 285° flat), dashed blue -->
    <polygon points="0,-141.67 122.7,-70.83 122.7,70.83 0,141.67 -122.7,70.83 -122.7,-70.83"
      fill="none" stroke="#2D7DD2" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- measured amplitude polygon -->
    <polygon points="0,-163.3 98.1,-56.65 79.4,45.84 0,153.3 -72.2,41.67 -89.46,-51.65"
      fill="#FF5C5C" fill-opacity="0.16" stroke="#FF5C5C" stroke-width="2.5"/>
    <!-- vertices -->
    <g fill="#FF5C5C">
      <circle cx="0" cy="-163.3" r="4.5"/>
      <circle cx="98.1" cy="-56.65" r="4.5"/>
      <circle cx="79.4" cy="45.84" r="4.5"/>
      <circle cx="0" cy="153.3" r="4.5"/>
      <circle cx="-72.2" cy="41.67" r="4.5"/>
      <circle cx="-89.46" cy="-51.65" r="4.5"/>
    </g>

    <!-- scale numbers along top axis -->
    <g fill="#5A5A58" font-size="9">
      <text x="6" y="-48">230°</text>
      <text x="6" y="-98">260°</text>
      <text x="6" y="-148">290°</text>
      <text x="6" y="-196">320°</text>
    </g>

    <!-- axis labels (position + value) -->
    <g font-size="12" fill="#C2C8CE" text-anchor="middle">
      <text x="0" y="-220">CH <tspan fill="#FF8A8A" font-weight="700">298°</tspan></text>
      <text x="201" y="-108">12H <tspan fill="#FF8A8A" font-weight="700">268°</tspan></text>
      <text x="201" y="120">3H <tspan fill="#FF8A8A" font-weight="700">255°</tspan></text>
      <text x="0" y="232">CB <tspan fill="#FF8A8A" font-weight="700">292°</tspan></text>
      <text x="-201" y="120">6H <tspan fill="#FF8A8A" font-weight="700">250°</tspan></text>
      <text x="-201" y="-108">9H <tspan fill="#FF8A8A" font-weight="700">262°</tspan></text>
    </g>
  </g>

  <!-- legend -->
  <g font-size="11">
    <rect x="306" y="676" width="16" height="10" fill="#FF5C5C" fill-opacity="0.5" stroke="#FF5C5C"/>
    <text x="328" y="685" fill="#9A9DA1">Measured amplitude</text>
    <line x1="470" y1="681" x2="486" y2="681" stroke="#2D7DD2" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="492" y="685" fill="#9A9DA1">Target (285°)</text>
    <rect x="600" y="676" width="16" height="10" fill="#E9C46A" fill-opacity="0.4" stroke="#9A6A00" stroke-dasharray="2 3"/>
    <text x="622" y="685" fill="#9A9DA1">Healthy zone 250–310°</text>
  </g>

  <!-- ============ RIGHT PANEL: diagnosis ============ -->
  <rect x="972" y="158" width="296" height="556" fill="#202020" stroke="#2E2E2C"/>
  <text x="990" y="186" fill="#9A9DA1" font-size="11" letter-spacing="1">DIAGNOSIS</text>

  <!-- verdict badge -->
  <rect x="990" y="198" width="260" height="52" fill="#13261A" stroke="#2C9118"/>
  <circle cx="1012" cy="224" r="7" fill="#5FDD45"/>
  <text x="1028" y="220" fill="#5FDD45" font-size="15" font-weight="700">OK — Healthy</text>
  <text x="1028" y="238" fill="#8FB58A" font-size="11">Stable enough to record</text>

  <!-- metric rows -->
  <g font-size="12">
    <text x="990" y="284" fill="#9A9DA1">Mean amplitude</text>
    <text x="1250" y="284" fill="#C2C8CE" text-anchor="end" font-weight="600">271°</text>
    <line x1="990" y1="296" x2="1250" y2="296" stroke="#2A2A28"/>

    <text x="990" y="320" fill="#9A9DA1">Amplitude spread</text>
    <text x="1250" y="320" fill="#E9C46A" text-anchor="end" font-weight="600">250°–298° (Δ48°)</text>
    <line x1="990" y1="332" x2="1250" y2="332" stroke="#2A2A28"/>

    <text x="990" y="356" fill="#9A9DA1">DU/DD delta</text>
    <text x="1250" y="356" fill="#C2C8CE" text-anchor="end" font-weight="600">+6°</text>
    <line x1="990" y1="368" x2="1250" y2="368" stroke="#2A2A28"/>

    <text x="990" y="392" fill="#9A9DA1">Rate spread</text>
    <text x="1250" y="392" fill="#C2C8CE" text-anchor="end" font-weight="600">+4 … +9 s/d</text>
    <line x1="990" y1="404" x2="1250" y2="404" stroke="#2A2A28"/>

    <text x="990" y="428" fill="#9A9DA1">Beat error (max)</text>
    <text x="1250" y="428" fill="#C2C8CE" text-anchor="end" font-weight="600">0.6 ms</text>
    <line x1="990" y1="440" x2="1250" y2="440" stroke="#2A2A28"/>

    <text x="990" y="464" fill="#9A9DA1">Positions measured</text>
    <text x="1250" y="464" fill="#C2C8CE" text-anchor="end" font-weight="600">6 / 6</text>
  </g>

  <!-- worst position note -->
  <rect x="990" y="492" width="260" height="64" fill="#1A1A18" stroke="#2E2E2C"/>
  <text x="1004" y="514" fill="#9A9DA1" font-size="11">Weakest position</text>
  <text x="1004" y="536" fill="#FF8A8A" font-size="14" font-weight="700">6H · 250°</text>
  <text x="1120" y="536" fill="#7E7E7E" font-size="11">near lower bound</text>

  <text x="990" y="586" fill="#6E6E6E" font-size="10">Rule-based, from live multi-position data.</text>
  <text x="990" y="602" fill="#6E6E6E" font-size="10">Reuses the Positions sequence — no new sensor.</text>

  <!-- ============ status bar ============ -->
  <rect x="0" y="714" width="1280" height="34" fill="#232321"/>
  <line x1="0" y1="714" x2="1280" y2="714" stroke="#333333"/>
  <circle cx="18" cy="731" r="5" fill="#5FDD45"/>
  <text x="32" y="736" fill="#9A9DA1" font-size="11">Synced · 21,600 BPH · CH (Dial Up)</text>
  <text x="430" y="736" fill="#6E6E6E" font-size="11">E2E 3.9 ms · worst 40 ms / 167 ms budget · 0 drop · 0 miss</text>
  <text x="1262" y="736" fill="#5FDD45" font-size="11" text-anchor="end">OK — stable enough to record</text>
</svg>
