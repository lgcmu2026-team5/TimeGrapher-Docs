<svg viewBox="0 0 1200 310" xmlns="http://www.w3.org/2000/svg"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546E7A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="310" fill="#F8F9FA" rx="10"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#212121">
    새 디스플레이 추가 레시피 — 기존 분석 알고리즘 변경 없음 (QAS-5)
  </text>

  <!-- ── STEP 1 : Core.Shared / AnalysisFrame ── -->
  <rect x="28"  y="48" width="188" height="192" rx="8" fill="#EBF5FF" stroke="#1565C0" stroke-width="1.5"/>
  <rect x="28"  y="48" width="188" height="34"  rx="8" fill="#1565C0"/>
  <rect x="28"  y="70" width="188" height="12"  fill="#1565C0"/>
  <text x="122" y="70"  text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">STEP 1</text>
  <text x="122" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#1565C0">Core.Shared</text>
  <text x="122" y="121" text-anchor="middle" font-size="10" fill="#546E7A" font-style="italic">AnalysisFrame.cs</text>
  <line x1="48"  y1="133" x2="196" y2="133" stroke="#BBDEFB" stroke-width="1"/>
  <text x="122" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#0D47A1">새 속성</text>
  <text x="122" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#0D47A1">필드 추가</text>
  <rect x="54"  y="212" width="136" height="22" rx="11" fill="#BBDEFB"/>
  <text x="122" y="227" text-anchor="middle" font-size="10" fill="#1565C0" font-weight="600">기존 파일, 1줄 추가</text>

  <!-- Arrow 1 -->
  <line x1="218" y1="145" x2="244" y2="145" stroke="#546E7A" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── STEP 2 : Core.Analysis / AnalysisWorker ── -->
  <rect x="248" y="48" width="188" height="192" rx="8" fill="#EBF5FF" stroke="#1565C0" stroke-width="1.5"/>
  <rect x="248" y="48" width="188" height="34"  rx="8" fill="#1565C0"/>
  <rect x="248" y="70" width="188" height="12"  fill="#1565C0"/>
  <text x="342" y="70"  text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">STEP 2</text>
  <text x="342" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#1565C0">Core.Analysis</text>
  <text x="342" y="121" text-anchor="middle" font-size="10" fill="#546E7A" font-style="italic">AnalysisWorker.cs</text>
  <line x1="268" y1="133" x2="416" y2="133" stroke="#BBDEFB" stroke-width="1"/>
  <text x="342" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#0D47A1">값 할당</text>
  <text x="342" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#0D47A1">한 줄</text>
  <rect x="274" y="212" width="136" height="22" rx="11" fill="#BBDEFB"/>
  <text x="342" y="227" text-anchor="middle" font-size="10" fill="#1565C0" font-weight="600">기존 파일, 1줄 추가</text>

