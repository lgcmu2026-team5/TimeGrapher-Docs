  <rect x="468" y="70" width="188" height="12"  fill="#2E7D32"/>
  <text x="562" y="70"  text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">STEP 3</text>
  <text x="562" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#2E7D32">App.Rendering</text>
  <text x="562" y="121" text-anchor="middle" font-size="10" fill="#546E7A" font-style="italic">FooRenderer.cs  ← 신규</text>
  <line x1="488" y1="133" x2="636" y2="133" stroke="#C8E6C9" stroke-width="1"/>
  <text x="562" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#1B5E20">새 파일 생성</text>
  <text x="562" y="178" text-anchor="middle" font-size="13" fill="#2E7D32">기존 파일 무변경</text>
  <rect x="487" y="212" width="150" height="22" rx="11" fill="#C8E6C9"/>
  <text x="562" y="227" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="600">기존 파일 변경 없음</text>

  <!-- Arrow 3 -->
  <line x1="658" y1="145" x2="684" y2="145" stroke="#546E7A" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── STEP 4 : App.Tabs / InfoTabCatalog ── -->
  <rect x="688" y="48" width="188" height="192" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <rect x="688" y="48" width="188" height="34"  rx="8" fill="#2E7D32"/>
  <rect x="688" y="70" width="188" height="12"  fill="#2E7D32"/>
  <text x="782" y="70"  text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">STEP 4</text>
  <text x="782" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#2E7D32">App.Tabs</text>
  <text x="782" y="121" text-anchor="middle" font-size="10" fill="#546E7A" font-style="italic">InfoTabCatalog.cs</text>
  <line x1="708" y1="133" x2="856" y2="133" stroke="#C8E6C9" stroke-width="1"/>
