  <text x="782" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#1B5E20">한 줄 등록</text>
  <rect x="707" y="212" width="150" height="22" rx="11" fill="#C8E6C9"/>
  <text x="782" y="227" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="600">기존 파일 변경 없음</text>

  <!-- Arrow 4 -->
  <line x1="878" y1="145" x2="904" y2="145" stroke="#546E7A" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── RESULT ── -->
  <rect x="908" y="48" width="264" height="192" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="2"/>
  <rect x="908" y="48" width="264" height="34"  rx="8" fill="#F57F17"/>
  <rect x="908" y="70" width="264" height="12"  fill="#F57F17"/>
  <text x="1040" y="70"  text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">완료</text>
  <text x="1040" y="116" text-anchor="middle" font-size="30" fill="#E65100">&#10003;</text>
  <text x="1040" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#BF360C">새 탭 즉시 작동</text>
  <line x1="928" y1="162" x2="1152" y2="162" stroke="#FFE0B2" stroke-width="1"/>
  <text x="1040" y="180" text-anchor="middle" font-size="10" fill="#6D4C41">AnalysisFrameRouter</text>
  <text x="1040" y="196" text-anchor="middle" font-size="10" fill="#6D4C41">자동 인식 · Scheduler 자동 연결</text>
  <rect x="948" y="212" width="184" height="22" rx="11" fill="#FFE0B2"/>
  <text x="1040" y="227" text-anchor="middle" font-size="10" fill="#E65100" font-weight="600">인프라 변경 없음, 자동 처리</text>

  <!-- ── Bottom summary bar ── -->
  <rect x="28" y="252" width="1144" height="46" rx="6" fill="#263238"/>
  <text x="600" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#ECEFF1">
    기존 Core 분석 알고리즘 (Detection · Metrics · Imaging) 변경 없음
  </text>
  <text x="600" y="289" text-anchor="middle" font-size="11" fill="#90A4AE">
    Router · Scheduler 인프라 자동 처리 → QAS-5 달성: 새 기능당 기존 모듈 최대 1개 변경
  </text>
</svg>
